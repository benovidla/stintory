name: Source packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_sources.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: Stintory-source-installers
          path: dist/Stintory-*
